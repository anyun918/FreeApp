<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 苹果 App 限免精选</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">

    <!-- 顶部导航 -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 border-b border-slate-100 shadow-xs">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">App 限免精选</h1>
            <span class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-600 rounded-full" id="current-date">今日更新</span>
        </div>
    </header>

    <!-- 管理后台 (网址带 ?admin 时自动显示) -->
    <div id="admin-panel" class="hidden max-w-2xl mx-auto px-4 mt-4">
        <div class="bg-white border-2 border-dashed border-blue-200 rounded-2xl p-4 space-y-3">
            <h2 class="text-sm font-bold text-blue-600">🛠️ 极速发布控制台</h2>
            <input type="text" id="admin-url" placeholder="粘贴 App Store 链接或输入应用 ID" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20">
            <!-- 新增：兑换码直达链接输入框 -->
            <input type="text" id="admin-redeem" placeholder="[可选] 兑换码/礼品卡直达链接（无则留空）" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20">
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="admin-tag" placeholder="标签(默认:内购限免)" class="px-3 py-2 border rounded-xl text-sm">
                <input type="password" id="admin-pwd" placeholder="发布口令" class="px-3 py-2 border rounded-xl text-sm">
            </div>
            <button id="admin-submit-btn" class="w-full py-2 bg-blue-600 text-white font-bold text-sm rounded-xl cursor-pointer">一键抓取并发布</button>
        </div>
    </div>

    <!-- 检索和过滤区 -->
    <div class="max-w-2xl mx-auto px-4 mt-4 space-y-4">
        <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 text-xs">
            提示：微信内无法跳转请点击右上角 <span class="font-bold">···</span> 选择 <span class="font-bold">在浏览器中打开</span> 即可直达 App Store。
        </div>
        <!-- 搜索框 -->
        <input type="text" id="search-input" placeholder="🔍 输入关键字搜索..." class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm shadow-xs focus:ring-2 focus:ring-blue-500/20">
        <!-- 分类标签 -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-1" id="category-tags">
            <button data-cat="all" class="cat-btn shrink-0 px-3.5 py-1.5 text-xs font-medium rounded-full bg-blue-600 text-white cursor-pointer">全部</button>
        </div>
    </div>

    <!-- 状态与内容容器 -->
    <div id="loading-state" class="text-center py-12 text-slate-400 text-sm">⏳ 正在加载数据库...</div>
    <main class="max-w-2xl mx-auto px-4 mt-6 space-y-4 hidden" id="app-list-container"></main>
    <div id="empty-state" class="hidden text-center py-12 text-slate-400 text-sm">📥 没有找到相关限免应用</div>

    <!-- 页脚说明 -->
    <footer class="max-w-2xl mx-auto px-4 mt-12 text-center text-[11px] text-slate-400 space-y-1">
        <p>本站仅作限时免费信息导航，数据同步自 Apple 官方接口，版权归原作者所有。</p>
        <p>限免时效性强，下载前请务必确认 App Store 价格已变为「获取」或「免费」。</p>
    </footer>

    <script>
        // 【注意】请将此处修改为您在 Cloudflare Worker 生成的真实访问网址（不以 / 结尾）
        const API_BASE = "https://your-worker.your-subdomain.workers.dev"; 

        let appsData = [], currentCategory = "all", searchQuery = "";
        const container = document.getElementById('app-list-container');
        const emptyState = document.getElementById('empty-state');
        const loadingState = document.getElementById('loading-state');

        // 拉取数据
        async function fetchApps() {
            try {
                const res = await fetch(`${API_BASE}/api/apps`);
                appsData = await res.json();
                loadingState.classList.add('hidden');
                container.classList.remove('hidden');
                buildTags();
                renderList();
            } catch (err) { loadingState.innerText = "数据加载失败，请刷新重试"; }
        }

        // 构建分类按钮
        function buildTags() {
            const tagsBox = document.getElementById('category-tags');
            const cats = ['all', ...new Set(appsData.map(a => a.category))];
            tagsBox.innerHTML = cats.map(c => `
                <button data-cat="${c}" class="cat-btn shrink-0 px-3.5 py-1.5 text-xs font-medium rounded-full ${c==='all'?'bg-blue-600 text-white':'bg-white text-slate-600 border border-slate-200'} cursor-pointer">${c==='all'?'全部':c}</button>
            `).join('');
        }

        // 渲染列表
        function renderList() {
            const filtered = appsData.filter(a => {
                return (currentCategory === "all" || a.category === currentCategory) &&
                       (a.name.toLowerCase().includes(searchQuery) || a.desc.toLowerCase().includes(searchQuery));
            });

            if (filtered.length === 0) {
                container.innerHTML = ""; emptyState.classList.remove('hidden'); return;
            }
            emptyState.classList.add('hidden');

            container.innerHTML = filtered.map(app => `
                <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-xs hover:shadow-md transition-all duration-300 flex items-start space-x-4">
                    <img src="${app.icon}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover bg-slate-100 shrink-0">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center space-x-2">
                            <h3 class="text-base font-bold text-slate-900 truncate">${app.name}</h3>
                            <span class="text-[10px] font-bold px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded-md">${app.tag}</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">分类：${app.category}</p>
                        <p class="text-xs text-slate-500 mt-2 line-clamp-2">${app.desc}</p>
                        <div class="flex items-center justify-between mt-4 pt-3 border-t border-slate-50">
                            <div class="flex items-baseline space-x-1">
                                <span class="text-lg font-black text-blue-600">FREE</span>
                                <span class="text-xs text-slate-400 line-through">${app.originalPrice}</span>
                            </div>
                            
                            <!-- 动态按钮区域：有兑换码时展示兑换按钮，无则自动隐藏 -->
                            <div class="flex items-center space-x-2">
                                ${app.redeemUrl ? `
                                    <a href="${app.redeemUrl}" target="_blank" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-full transition-colors flex items-center space-x-1">
                                        <span>🎁 兑换码</span>
                                    </a>
                                ` : ''}
                                <a href="https://apps.apple.com/cn/app/id${app.id}" target="_blank" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-full transition-colors">获取</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 事件监听
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim(); renderList();
        });

        document.getElementById('category-tags').addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn'); if (!btn) return;
            document.querySelectorAll('.cat-btn').forEach(b => b.className = "cat-btn shrink-0 px-3.5 py-1.5 text-xs font-medium rounded-full bg-white text-slate-600 border border-slate-200 cursor-pointer");
            btn.className = "cat-btn shrink-0 px-3.5 py-1.5 text-xs font-medium rounded-full bg-blue-600 text-white cursor-pointer";
            currentCategory = btn.dataset.cat; renderList();
        });

        if (window.location.search.includes('admin')) document.getElementById('admin-panel').classList.remove('hidden');

        // 发布逻辑
        document.getElementById('admin-submit-btn').addEventListener('click', async () => {
            const appUrl = document.getElementById('admin-url').value.trim();
            const redeemUrl = document.getElementById('admin-redeem').value.trim(); // 获取兑换码链接
            const tag = document.getElementById('admin-tag').value.trim();
            const password = document.getElementById('admin-pwd').value.trim();
            if (!appUrl || !password) return alert("参数不能为空");

            try {
                const btn = document.getElementById('admin-submit-btn');
                btn.innerText = "同步苹果数据中..."; btn.disabled = true;

                const res = await fetch(`${API_BASE}/api/add`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ appUrl, redeemUrl, tag, password })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`发布成功: 《${data.app.name}》`);
                    document.getElementById('admin-url').value = ""; 
                    document.getElementById('admin-redeem').value = "";
                    fetchApps();
                } else alert(`错误: ${data.error}`);
            } catch (err) { alert("网络请求失败"); } 
            finally {
                const btn = document.getElementById('admin-submit-btn');
                btn.innerText = "一键抓取并发布"; btn.disabled = false;
            }
        });

        document.getElementById('current-date').innerText = `${new Date().getFullYear()}年${new Date().getMonth()+1}月${new Date().getDate()}日`;
        fetchApps();
    </script>
</body>
</html>
